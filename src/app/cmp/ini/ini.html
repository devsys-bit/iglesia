<div id="carouselInicio" class="carousel slide carousel-fade">
  <!-- Indicadores -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselInicio" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner vh-100">
    <div class="carousel-item active h-100 position-relative">
      <img src="slider/img1.webp" class="d-block w-100 h-100 object-fit-cover" alt="Slide 1" />

      <!-- Overlay general -->
      <div class="position-absolute top-0 start-0 w-100 h-100" style="background-color: rgba(0, 0, 0, 0.4)"></div>

      <!-- Overlay del caption -->
      <div class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center">
        <div class="p-4 text-center" style="background-color: rgba(0, 0, 0, 0.5)">
          <h1 class="text-white display-3">Bienvenido a Nuestra Iglesia</h1>
          <p class="text-white lead">Un lugar para crecer en la palabra de Dios</p>
        </div>
      </div>
    </div>

    <div class="carousel-item h-100 position-relative">
      <img src="slider/img2.webp" class="d-block w-100 h-100 object-fit-cover" alt="Slide 2" />
      <div class="position-absolute top-0 start-0 w-100 h-100" style="background-color: rgba(0, 0, 0, 0.4)"></div>
      <div class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center">
        <div class="p-4 text-center" style="background-color: rgba(0, 0, 0, 0.5)">
          <h1 class="text-white display-3">Conoce Nuestra Misión</h1>
          <p class="text-white lead">Compartiendo la palabra y el amor de Dios</p>
        </div>
      </div>
    </div>

    <div class="carousel-item h-100 position-relative">
      <img src="slider/img3.webp" class="d-block w-100 h-100 object-fit-cover" alt="Slide 3" />
      <div class="position-absolute top-0 start-0 w-100 h-100" style="background-color: rgba(0, 0, 0, 0.4)"></div>
      <div class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center">
        <div class="p-4 text-center" style="background-color: rgba(0, 0, 0, 0.5)">
          <h1 class="text-white display-3">Únete a Nuestros Eventos</h1>
          <p class="text-white lead">Reuniones, cultos y obras misioneras</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Flechas -->
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselInicio" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselInicio" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>
