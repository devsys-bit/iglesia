<div class="container">
  <!-- Título principal -->
  <div class="text-center mb-5 ¿">
    <h2 class="fw-bold text-uppercase">CONTACTO</h2>
    <p class="text-muted">Estamos aquí para escucharte y ayudarte en todo lo que necesites.</p>
    <hr class="w-25 mx-auto border-2 border-dark" />
  </div>

  <div class="row g-4 bg-white p-5">
    <!-- Contactos a la izquierda -->
    <div class="col-md-4">
      <h4 class="fw-bold">Nombre de la Iglesia</h4>
      <p class="mb-2"><strong>Dirección:</strong> Av. Principal #123, Ciudad, País</p>
      <p class="mb-2"><strong>Teléfono:</strong> +1 234 567 890</p>
      <p class="mb-2"><strong>Email:</strong> contacto@iglesia.com</p>
      <p class="mb-2"><strong>Redes Sociales:</strong></p>
      <div class="d-flex gap-3">
        <a href="#" target="_blank"><i class="fab fa-facebook fa-lg"></i></a>
        <a href="#" target="_blank"><i class="fab fa-instagram fa-lg"></i></a>
        <a href="#" target="_blank"><i class="fab fa-twitter fa-lg"></i></a>
        <a href="#" target="_blank"><i class="fab fa-youtube fa-lg"></i></a>
      </div>
    </div>

    <!-- Formulario a la derecha -->
    <div class="col-md-8">
      <form>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="Tu email">
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe tu mensaje"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </div>

    <!-- Ubicacion -->
    <div class="col-md-12">
          <h5 class="fw-bold mb-3">Nuestra Ubicación</h5>
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d194349.10636539652!2d-3.9913647924914617!3d40.437535391152885!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd422997800a3c81%3A0xc436dec1618c2269!2zTWFkcmlkLCBFc3Bhw7Fh!5e0!3m2!1ses!2sve!4v1758724558560!5m2!1ses!2sve"
